; Applies automatically under PHP-FPM (the standard setup for Laravel
; production hosts) without needing root access to edit the server's
; global php.ini. Ships with the app so this travels with every
; deploy instead of being a manual step someone forgets.
;
; Raised specifically for the account-import Excel/CSV upload
; (AccountResource's "رفع حسابات لمدير" action, maxSize 20480 KB) —
; the default 2M/8M limits silently reject any file over 2MB before
; Laravel even sees the request, which a batch of thousands of
; accounts can easily exceed.
;
; NOTE: .user.ini is cached by PHP-FPM (opcache.revalidate_freq,
; default ~300s) — changes may take a few minutes to apply after
; deploy, or a `php-fpm reload` makes it immediate. If the production
; server runs Apache with mod_php instead of PHP-FPM, this file has
; NO effect — set upload_max_filesize/post_max_size in the real
; php.ini or a <Directory> block instead, and add
; `LimitRequestBody 26214400` to .htaccess if using mod_php with
; Apache's own body-size limit.
upload_max_filesize = 20M
post_max_size = 25M
